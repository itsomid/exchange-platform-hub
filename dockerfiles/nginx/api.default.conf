server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;
    
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 172.16.0.0/12;

    # Cache static assets (images, fonts, etc.) for 30 days
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|eot|otf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # fastcgi_param REMOTE_ADDR $proxy_add_x_forwarded_for; # Send user's real IP
    }

    error_log /var/log/nginx/api.error.log;
    access_log /var/log/nginx/api.access.log;
}
