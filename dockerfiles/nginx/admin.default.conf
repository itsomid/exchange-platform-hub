# WebSocket connection upgrade map — required for proper WS proxying through proxy chains
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 172.16.0.0/12;

    # Cache static assets (images, fonts, etc.) for 30 days
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|eot|otf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Proxy Laravel Reverb WebSocket traffic (/app/ = subscribe, /apps/ = Pusher auth)
    location ~* ^/(app|apps)/ {
        proxy_pass http://admin-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 60;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-admin:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    error_log /var/log/nginx/admin.error.log;
    access_log /var/log/nginx/admin.access.log;
}