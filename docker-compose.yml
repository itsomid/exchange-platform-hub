  #        image: redis:alpine
  #        container_name: redis
  #        restart: unless-stopped
  #        ports:
  #            - 6380:6379
  #        networks:
  #            - laravel

    #  phpmyadmin:
    #    image: phpmyadmin:5.2.0
    #    container_name: phpmyadmin
    #    env_file:
    #      - ./env/phpmyadmin.env
    #    depends_on:
    #      - database
    #    ports:
    #      - 8888:80
    #    networks:
    #      - laravel